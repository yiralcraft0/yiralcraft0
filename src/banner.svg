<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Priyanshu Kumar terminal banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <clipPath id="body"><rect x="1" y="36" width="898" height="263"/></clipPath>
    <clipPath id="c1"><rect class="r r1" x="28" y="52" width="0" height="26"/></clipPath>
    <clipPath id="c2"><rect class="r r2" x="28" y="82" width="0" height="46"/></clipPath>
    <clipPath id="c3"><rect class="r r3" x="28" y="140" width="0" height="26"/></clipPath>
    <clipPath id="c4"><rect class="r r4" x="28" y="166" width="0" height="26"/></clipPath>
    <clipPath id="c5"><rect class="r r5" x="28" y="204" width="0" height="26"/></clipPath>
    <clipPath id="c6"><rect class="r r6" x="28" y="230" width="0" height="26"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    .p  { fill:#4ade80; font-size:15px; font-weight:700; }
    .cmd{ fill:#e6edf3; font-size:15px; }
    .out{ fill:#9ca3af; font-size:15px; }
    .hi { fill:#4ade80; font-size:36px; font-weight:700; letter-spacing:1px; }
    .acc{ fill:#fbbf24; font-size:15px; }
    .dim{ fill:#6b7280; font-size:12px; }
    .tag{ fill:#4ade80; font-size:11px; letter-spacing:2px; font-weight:700; }
    .r  { animation-duration:16s; animation-iteration-count:infinite; animation-timing-function:steps(10,end); }
    .r1 { animation-name:t1; animation-timing-function:steps(8,end); }
    .r2 { animation-name:t2; animation-timing-function:steps(15,end); }
    .r3 { animation-name:t3; animation-timing-function:steps(14,end); }
    .r4 { animation-name:t4; animation-timing-function:steps(60,end); }
    .r5 { animation-name:t5; animation-timing-function:steps(11,end); }
    .r6 { animation-name:t6; animation-timing-function:steps(30,end); }
    @keyframes t1{0%,3%{width:0}6.3%,94%{width:80px}100%{width:0}}
    @keyframes t2{0%,11%{width:0}19%,94%{width:340px}100%{width:0}}
    @keyframes t3{0%,21%{width:0}27%,94%{width:135px}100%{width:0}}
    @keyframes t4{0%,29%{width:0}40%,94%{width:560px}100%{width:0}}
    @keyframes t5{0%,44%{width:0}49%,94%{width:105px}100%{width:0}}
    @keyframes t6{0%,51%{width:0}61%,94%{width:290px}100%{width:0}}
    .fin { animation:fin 16s infinite; opacity:0; }
    @keyframes fin{0%,63%{opacity:0}64%,94%{opacity:1}100%{opacity:0}}
    .tagfade { animation:tf 16s infinite; opacity:0; }
    @keyframes tf{0%,19%{opacity:0}22%,94%{opacity:1}100%{opacity:0}}
    .cur { animation:blink 1s steps(1,end) infinite; }
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .pulse { animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .f { font-size:14px; fill:#4ade80; opacity:0; animation:fall 9s linear infinite; }
    @keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:.35}85%{opacity:.2}100%{transform:translateY(250px);opacity:0}}
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="36" width="898" height="263" fill="url(#glow)" clip-path="url(#body)"/>

  <!-- falling code characters -->
  <g clip-path="url(#body)">
    <text class="f" x="640" y="40" style="animation-delay:0s">1</text>
    <text class="f" x="700" y="40" style="animation-delay:2.5s">{ }</text>
    <text class="f" x="760" y="40" style="animation-delay:5s">0</text>
    <text class="f" x="820" y="40" style="animation-delay:1.2s">&lt;/&gt;</text>
    <text class="f" x="860" y="40" style="animation-delay:6.3s">;</text>
    <text class="f" x="670" y="40" style="animation-delay:7.4s">01</text>
    <text class="f" x="790" y="40" style="animation-delay:3.8s">()</text>
    <text class="f" x="600" y="40" style="animation-delay:4.6s">#</text>
  </g>

  <!-- title bar -->
  <path d="M0.5 14.5 a14 14 0 0 1 14 -14 H885.5 a14 14 0 0 1 14 14 V36 H0.5 Z" fill="#161b22"/>
  <line x1="0" y1="36.5" x2="900" y2="36.5" stroke="#30363d"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" class="dim">yiralcraft0@github: ~/profile</text>
  <circle class="pulse" cx="728" cy="18" r="3.5" fill="#4ade80"/>
  <text x="878" y="22" text-anchor="end" class="tag">OPEN TO COLLABORATE</text>

  <!-- terminal content -->
  <g clip-path="url(#c1)">
    <text x="28" y="70"><tspan class="p">$ </tspan><tspan class="cmd">whoami</tspan></text>
  </g>
  <g clip-path="url(#c2)">
    <text x="28" y="118" class="hi">PRIYANSHU KUMAR</text>
  </g>
  <text class="tagfade dim" x="872" y="118" text-anchor="end"># BTech CSE from @ KL University</text>

  <g clip-path="url(#c3)">
    <text x="28" y="158"><tspan class="p">$ </tspan><tspan class="cmd">cat role.txt</tspan></text>
  </g>
  <g clip-path="url(#c4)">
    <text x="28" y="184" class="out">Aspiring Software Developer <tspan class="acc">·</tspan> Software Engineering</text>
  </g>

  <g clip-path="url(#c5)">
    <text x="28" y="222"><tspan class="p">$ </tspan><tspan class="cmd">echo $NOW</tspan></text>
  </g>
  <g clip-path="url(#c6)">
    <text x="28" y="248" class="out">learning <tspan class="acc">DSA,</tspan>  <tspan class="acc">Computer Vision</tspan> &amp; <tspan class="acc">AI</tspan> </text>
  </g>

  <g class="fin">
    <text x="28" y="280" class="p">$</text>
    <rect class="cur" x="46" y="267" width="9" height="16" fill="#4ade80"/>
  </g>

  <!-- scanlines -->
  <rect x="1" y="37" width="898" height="262" fill="url(#scan)" clip-path="url(#body)" pointer-events="none"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5">
    <path d="M14 56 V48 H22"/>
    <path d="M886 56 V48 H878"/>
    <path d="M14 282 V290 H22"/>
    <path d="M886 282 V290 H878"/>
  </g>
</svg>
