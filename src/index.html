<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #0d1117; color: #c9d1d9;
    font-family: 'JetBrains Mono', Consolas, Menlo, monospace;
    user-select: none; touch-action: none;
  }
  h1 { margin: 0; font-size: 20px; color: #4ade80; letter-spacing: 2px; }
  .bar { display: flex; justify-content: space-between; width: 400px; max-width: 92vw; font-size: 14px; }
  canvas {
    background: #0a1410; border: 1px solid #2f4f3e; border-radius: 10px;
    width: 400px; max-width: 92vw; height: auto; aspect-ratio: 1;
  }
  .hint { font-size: 12px; color: #8b949e; }
  button {
    background: #161b22; color: #4ade80; border: 1px solid #2f4f3e;
    padding: 6px 14px; border-radius: 7px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: #4ade80; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="bar">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="hint">Arrows / WASD to move · Space to pause · Swipe on mobile</div>
  <button id="restart">Restart</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

const SIZE = 20;                       // cells per row/column
const CELL = canvas.width / SIZE;      // pixel size of one cell
const START_SPEED = 130;               // ms per move (lower = faster)

let snake, dir, queue, food, score, best, timer, speed, paused, over;

// High score (wrapped in try/catch in case storage is unavailable)
try { best = Number(localStorage.getItem('snakeBest')) || 0; } catch { best = 0; }
bestEl.textContent = best;

function init() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  queue = [];                          // buffered turns so fast key presses aren't lost
  score = 0; speed = START_SPEED;
  paused = false; over = false;
  scoreEl.textContent = 0;
  placeFood();
  clearInterval(timer);
  timer = setInterval(tick, speed);
  draw();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function turn(nx, ny) {
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (nx === -last.x && ny === -last.y) return;   // no 180° reversal
  if (nx === last.x && ny === last.y) return;     // same direction
  if (queue.length < 3) queue.push({ x: nx, y: ny });
}

function tick() {
  if (paused || over) return;
  if (queue.length) dir = queue.shift();

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall or self collision
  const hitWall = head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    if (score % 5 === 0 && speed > 60) {            // speed up every 5 points
      speed -= 10;
      clearInterval(timer);
      timer = setInterval(tick, speed);
    }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  over = true;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem('snakeBest', best); } catch {}
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0a1410';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ade80' : '#22a55a';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });

  if (over || paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e6edf3';
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px monospace';
    ctx.fillText(over ? 'GAME OVER' : 'PAUSED', canvas.width / 2, canvas.height / 2 - 6);
    ctx.font = '13px monospace';
    ctx.fillText(over ? 'Press Enter or Restart' : 'Press Space to resume', canvas.width / 2, canvas.height / 2 + 20);
  }
}

// Keyboard
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'w'].includes(k)) turn(0, -1);
  else if (['arrowdown', 's'].includes(k)) turn(0, 1);
  else if (['arrowleft', 'a'].includes(k)) turn(-1, 0);
  else if (['arrowright', 'd'].includes(k)) turn(1, 0);
  else if (k === ' ' && !over) { paused = !paused; draw(); }
  else if (k === 'enter' && over) init();
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
});

// Touch swipe
let tx, ty;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
  else turn(0, dy > 0 ? 1 : -1);
});

document.getElementById('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
